# Dev rejimi (hot reload). `docker compose up` buni avtomatik qo‘shadi.
# Prod uchun faqat asosiy fayl: docker compose -f docker-compose.yml up -d --build
services:
  backend:
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_DEBUG: "true"
    volumes:
      - ./backend:/app
      - ./namunalar:/app/namunalar:ro
      - static:/vol/static
      - media:/vol/media

  frontend:
    image: node:22-alpine
    build: !reset null
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx next dev -H 0.0.0.0 -p 3000"]
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    healthcheck:
      start_period: 180s
      retries: 60

  bot:
    volumes:
      - ./bot:/app

volumes:
  frontend_node_modules:
  frontend_next:
