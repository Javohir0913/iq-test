# Host nginx: vaqtinchalik "Tez orada" sahifasi (/var/www/iq-coming-soon).
# Faqat iq.coffee-nap.uz uchun; boshqa saytlarga ta’sir qilmaydi. SSL qatorlarini certbot qo‘shadi.
# Haqiqiy sayt ishga tushganda bu fayl deploy/nginx-iq.coffee-nap.uz.conf bilan almashtiriladi.
server {
    listen 80;
    server_name iq.coffee-nap.uz;

    root /var/www/iq-coming-soon;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(woff2|svg)$ { expires 30d; add_header Cache-Control "public"; }
    location / { try_files $uri /index.html; }
}
